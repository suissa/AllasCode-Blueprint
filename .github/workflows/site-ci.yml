name: Site CI

on:
  push:
    branches: [site]
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
