name: AtomicBehavior Manifest Schema

on:
  push:
    paths:
      - "Blueprint/manifest.yml"
      - "Blueprint/atomicbehavior/templates/manifest.yml"
      - "Blueprint/schemas/manifest/**"
      - "scripts/validate_atomicbehavior_manifest.py"
      - "tests/test_atomicbehavior_manifest.py"
      - ".github/workflows/atomicbehavior-manifest.yml"
  pull_request:
    paths:
      - "Blueprint/manifest.yml"
      - "Blueprint/atomicbehavior/templates/manifest.yml"
      - "Blueprint/schemas/manifest/**"
      - "scripts/validate_atomicbehavior_manifest.py"
      - "tests/test_atomicbehavior_manifest.py"
      - ".github/workflows/atomicbehavior-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate AtomicBehavior manifest schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validators
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2" "jsonschema==4.25.1"
      - name: Validate manifest and template
        run: python scripts/validate_atomicbehavior_manifest.py
      - name: Test required fields and failure cases
        run: python -m unittest discover -s tests -p 'test_atomicbehavior_manifest.py' -v
