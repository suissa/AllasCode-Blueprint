name: AllasCode FACoP Qualification

on:
  push:
    branches:
      - 'issue-*-tests'
    paths:
      - 'Blueprint/examples/commerce/**'
      - 'Blueprint/docs/facop/**'
      - 'Blueprint/compiler/facop/**'
      - '.github/workflows/commerce-facop-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evidence-closure:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Blueprint/examples/commerce
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: RestorePreviousPassport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=allascode-facop-passport&per_page=20" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$ID" ]; then
            mkdir -p .facop/previous
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > /tmp/facop-previous.zip
            unzip -q /tmp/facop-previous.zip -d .facop/previous
            echo "FACOP_PREVIOUS_PASSPORT=.facop/previous/passport.json" >> "$GITHUB_ENV"
            echo "Restored Evidence Passport artifact $ID"
          else
            echo "No previous Evidence Passport. Full characterization is required."
          fi
      - name: UpstreamStageAcceptance
        run: npm run facop:stage
      - name: FACoPQualification
        run: npm run facop:qualification
      - name: UploadEvidencePassport
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: allascode-facop-passport
          path: Blueprint/examples/commerce/.facop/evidence
