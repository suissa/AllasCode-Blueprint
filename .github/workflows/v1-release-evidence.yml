name: v1.0 Release Evidence Gate

on:
  pull_request:
    paths:
      - "scripts/validate-v1-release-evidence.py"
      - "tests/test_v1_release_evidence.py"
      - "release/evidence/v1.0/**"
      - ".github/workflows/v1-release-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator-tests:
    if: github.event_name == 'pull_request'
    name: Test release evidence validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run validator unit tests
        run: python -m unittest discover -s tests -p 'test_v1_release_evidence.py' -v

  validate-release-evidence:
    if: github.event_name == 'workflow_dispatch'
    name: Validate real pilot and operator evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate evidence package
        run: python scripts/validate-v1-release-evidence.py
