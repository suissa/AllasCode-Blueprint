name: AllasCode FACoP Stage

on:
  pull_request:
    branches:
      - examples
      - 'issue-*-stage'
    paths:
      - 'Blueprint/examples/commerce/**'
      - 'Blueprint/docs/facop/**'
      - 'Blueprint/compiler/facop/**'
      - '.github/workflows/commerce-facop-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-acceptance:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Blueprint/examples/commerce
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: FACoPStage
        run: npm run facop:stage
      - name: UploadStageEvidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: allascode-facop-stage-${{ github.sha }}
          path: Blueprint/examples/commerce/.facop/stage.json
