listen:
  injected_at_creation: true
  event: CodeManager.CreateHealingHypothesis.Requested
  schema: ./input.yml
emit:
  Ok:
    event: CodeManager.CreateHealingHypothesis.Ok
    schema: ./output.yml
  Error:
    event: CodeManager.CreateHealingHypothesis.Error
    semantic_type: HealingActionError
configurable_result_events: false
