suite:
  canonical_label: CodeKnowledge.PublishHealingCase.contract
  source: ../specifications/contract.yml
cases:
  - name: supported-experiment
    scenario: ../specifications/scenarios.yml#supported-experiment
    assert:
      - fixed_result_event
      - declared_authority_scope
      - preserved_original_intent
  - name: falsified-experiment
    scenario: ../specifications/scenarios.yml#falsified-experiment
    assert:
      - fixed_result_event
      - declared_authority_scope
      - preserved_original_intent
  - name: missing-provenance
    scenario: ../specifications/scenarios.yml#missing-provenance
    assert:
      - fixed_result_event
      - declared_authority_scope
      - preserved_original_intent
  - name: authority-boundary
    mutate_outside_declared_scope: true
    expected:
      result: Error
      mutation_applied: false
