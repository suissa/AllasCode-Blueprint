listen:
  injected_at_creation: true
  event: HumanHealing.RequestContext.Requested
  schema: ./input.yml
emit:
  Ok:
    event: HumanHealing.RequestContext.Ok
    schema: ./output.yml
  Error:
    event: HumanHealing.RequestContext.Error
    semantic_type: HealingActionError
configurable_result_events: false
