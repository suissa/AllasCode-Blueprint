execution:
  timeout_ms: 5000
  idempotent: true
  network: false
  deterministic_when_inputs_are_equal: true
sandbox:
  enabled: true
  workspace_only: true
authority:
  mode: bounded_config_write
  write_scope:
    - "configs/core.yml#<authorized-healable-property>"
failure:
  preserve_original_intent: true
  unresolved: Human-in-the-Healing-Loop
