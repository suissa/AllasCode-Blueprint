listen:
  injected_at_creation: true
  event: SystemHealer.StageConfigCandidate.Requested
  schema: ./input.yml
emit:
  Ok:
    event: SystemHealer.StageConfigCandidate.Ok
    schema: ./output.yml
  Error:
    event: SystemHealer.StageConfigCandidate.Error
    semantic_type: HealingActionError
configurable_result_events: false
