$schema: https://json-schema.org/draft/2020-12/schema
title: SystemHealer.StageConfigCandidate.output
type: object
additionalProperties: false
required:
  - "candidate_id"
  - "candidate_hash"
  - "config_diff"
  - "requested_tests"
properties:
  candidate_id:
    semantic_type: CandidateId
  candidate_hash:
    semantic_type: ContentHash
  config_diff:
    semantic_type: BoundedConfigDiff
  requested_tests:
    semantic_type: VerificationPlan
