preconditions:
  - "hypothesis_fault_class_is_system"
  - "hypothesis_hash_is_valid"
  - "config_property_is_declared_healable"
  - "candidate_value_is_inside_safety_bounds"
postconditions:
  Ok:
    - "exactly_the_authorized_configuration_dimension_changes"
    - "candidate_is_isolated_and_content_addressed"
  Error:
    - "base_configuration_remains_unchanged"
    - "authorization_or_bound_violation_is_reported"
invariants:
  - id: INV-CONFSTAGE-001
    rule: "only configs/core.yml and only an authorized healable property may change"
  - id: INV-CONFSTAGE-002
    rule: "Action implementations and semantic contracts are read-only"
  - id: INV-CONFSTAGE-003
    rule: "one causal configuration dimension changes per experiment whenever operationally safe"
  - id: INV-CONFSTAGE-004
    rule: "the candidate cannot promote or verify itself"
forbidden:
  - "modify code"
  - "change immutable or operator-only properties"
  - "change multiple unrelated settings"
  - "commit or merge"
verification:
  independent_when_mutation_is_involved: true
  preserve_original_intent: true
  event_results_are_fixed: [Ok, Error]
