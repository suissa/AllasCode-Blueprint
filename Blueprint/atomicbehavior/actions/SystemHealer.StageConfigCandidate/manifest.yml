api_version: allascode/v1
kind: AtomicBehavior
identity:
  canonical_label: SystemHealer.StageConfigCandidate
  version: 0.1.0
  maturity: specified
role:
  actor: SystemHealerAgent
purpose: "Stage a bounded system-configuration intervention authorized by an immutable system-fault hypothesis."
authority:
  mode: bounded_config_write
  read_scope:
    - "HealingHypothesis"
    - "configs/core.yml"
    - "configuration schema"
    - "safety bounds"
  write_scope:
    - "configs/core.yml#<authorized-healable-property>"
contract:
  input: ./schema/input.yml
  output: ./schema/output.yml
  error: ./schema/error.yml
  events: ./schema/events.yml
  specification: ./specifications/contract.yml
  scenarios: ./specifications/scenarios.yml
  healing: ./healing/pipeline.yml
  law: ./formalization/laws/core.law
  proof_evidence: ./formalization/proofs/core.prov
capabilities:
  - name: read_declared_inputs
    mode: read
  - name: read_declared_scope
    mode: read
  - name: write_declared_scope
    mode: effect
  - name: emit_fixed_result_event
    mode: emit
skills:
  authoring: ./skills/authoring/SKILL.md
  semantics: ./skills/semantics/SKILL.md
results:
  Ok: SystemHealer.StageConfigCandidate.Ok
  Error: SystemHealer.StageConfigCandidate.Error
