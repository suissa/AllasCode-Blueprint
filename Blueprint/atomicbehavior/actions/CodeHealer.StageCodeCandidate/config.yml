execution:
  timeout_ms: 5000
  idempotent: true
  network: false
  deterministic_when_inputs_are_equal: true
sandbox:
  enabled: true
  workspace_only: true
authority:
  mode: bounded_code_write
  write_scope:
    - "<target-action>/implementation/**"
failure:
  preserve_original_intent: true
  unresolved: Human-in-the-Healing-Loop
