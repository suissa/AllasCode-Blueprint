api_version: allascode/v1
kind: AtomicBehavior
identity:
  canonical_label: CodeRuntime.CaptureRuntimeEvidence
  version: 0.1.0
  maturity: specified
role:
  actor: CodeRuntimeAgent
purpose: "Normalize one completed execution's observed streams into provenance-preserving evidence without inferring a cause."
authority:
  mode: read_only
  read_scope:
    - "execution streams"
    - "source metadata"
    - "execution identity"  write_scope:
    []
contract:
  input: ./schema/input.yml
  output: ./schema/output.yml
  error: ./schema/error.yml
  events: ./schema/events.yml
  specification: ./specifications/contract.yml
  scenarios: ./specifications/scenarios.yml
  healing: ./healing/pipeline.yml
  law: ./formalization/laws/core.law
  proof_evidence: ./formalization/proofs/core.prov
capabilities:
  - name: read_declared_inputs
    mode: read
  - name: read_declared_scope
    mode: read
  - name: emit_fixed_result_event
    mode: emit
skills:
  authoring: ./skills/authoring/SKILL.md
  semantics: ./skills/semantics/SKILL.md
results:
  Ok: CodeRuntime.CaptureRuntimeEvidence.Ok
  Error: CodeRuntime.CaptureRuntimeEvidence.Error
