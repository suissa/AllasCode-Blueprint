listen:
  injected_at_creation: true
  event: CodeRuntime.CaptureRuntimeEvidence.Requested
  schema: ./input.yml
emit:
  Ok:
    event: CodeRuntime.CaptureRuntimeEvidence.Ok
    schema: ./output.yml
  Error:
    event: CodeRuntime.CaptureRuntimeEvidence.Error
    schema: ./error.yml
configurable_result_events: false
