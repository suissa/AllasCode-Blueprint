api_version: allascode/v1
kind: AtomicBehavior
identity:
  canonical_label: CodeHealer.RevertCandidate
  version: 0.1.0
  maturity: specified
role:
  actor: CodeHealerAgent
purpose: "Restore the exact pre-candidate code snapshot when rollback is authorized."
authority:
  mode: bounded_code_write
  read_scope:
    - "CandidateArtifact"
    - "base snapshot"
    - "rollback policy"
    - "approval reference"  write_scope:
    - "<target-action>/implementation/**"
contract:
  input: ./schema/input.yml
  output: ./schema/output.yml
  error: ./schema/error.yml
  events: ./schema/events.yml
  specification: ./specifications/contract.yml
  scenarios: ./specifications/scenarios.yml
  healing: ./healing/pipeline.yml
  law: ./formalization/laws/core.law
  proof_evidence: ./formalization/proofs/core.prov
capabilities:
  - name: read_declared_inputs
    mode: read
  - name: read_declared_scope
    mode: read
  - name: write_declared_scope
    mode: effect
  - name: emit_fixed_result_event
    mode: emit
skills:
  authoring: ./skills/authoring/SKILL.md
  semantics: ./skills/semantics/SKILL.md
results:
  Ok: CodeHealer.RevertCandidate.Ok
  Error: CodeHealer.RevertCandidate.Error
