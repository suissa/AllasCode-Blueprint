listen:
  injected_at_creation: true
  event: HealingVerifier.VerifyCandidate.Requested
  schema: ./input.yml
emit:
  Ok:
    event: HealingVerifier.VerifyCandidate.Ok
    schema: ./output.yml
  Error:
    event: HealingVerifier.VerifyCandidate.Error
    semantic_type: HealingActionError
configurable_result_events: false
