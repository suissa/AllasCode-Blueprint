api_version: allascode/v1
kind: AtomicBehavior
identity:
  canonical_label: HealingVerifier.VerifyCandidate
  version: 0.1.0
  maturity: specified
role:
  actor: HealingVerifier
purpose: "Independently compare predicted and observed candidate behavior and classify the healing experiment."
authority:
  mode: read_only_verification
  read_scope:
    - "HealingHypothesis"
    - "base artifact"
    - "candidate artifact"
    - "visible and hidden tests"
    - "runtime evidence"
    - "acceptance contracts"
  write_scope:
    []
contract:
  input: ./schema/input.yml
  output: ./schema/output.yml
  error: ./schema/error.yml
  events: ./schema/events.yml
  specification: ./specifications/contract.yml
  scenarios: ./specifications/scenarios.yml
  healing: ./healing/pipeline.yml
  law: ./formalization/laws/core.law
  proof_evidence: ./formalization/proofs/core.prov
capabilities:
  - name: read_declared_inputs
    mode: read
  - name: read_declared_scope
    mode: read
  - name: write_declared_scope
    mode: effect
  - name: emit_fixed_result_event
    mode: emit
skills:
  authoring: ./skills/authoring/SKILL.md
  semantics: ./skills/semantics/SKILL.md
results:
  Ok: HealingVerifier.VerifyCandidate.Ok
  Error: HealingVerifier.VerifyCandidate.Error
