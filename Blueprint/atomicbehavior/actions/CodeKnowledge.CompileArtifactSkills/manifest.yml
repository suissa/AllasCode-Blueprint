api_version: allascode/v1
kind: AtomicBehavior
identity:
  canonical_label: CodeKnowledge.CompileArtifactSkills
  version: 0.1.0
  maturity: specified
role:
  actor: CodeKnowledgeAgent
purpose: "Compile each canonical artifact into exactly one authoring Skill and one semantic Skill derived from the same versioned sources."
authority:
  mode: generated_write
  read_scope:
    - "artifact manifest"
    - "schemas"
    - "events"
    - "specifications"
    - "formalization"
    - "implementation metadata"
    - "tests"
  write_scope:
    - "generated/skills/<canonical_label>/authoring/**"
    - "generated/skills/<canonical_label>/semantics/**"
contract:
  input: ./schema/input.yml
  output: ./schema/output.yml
  events: ./schema/events.yml
  specification: ./specifications/contract.yml
  scenarios: ./specifications/scenarios.yml
  healing: ./healing/pipeline.yml
  law: ./formalization/laws/core.law
  proof_evidence: ./formalization/proofs/core.prov
skills:
  authoring: ./skills/authoring/SKILL.md
  semantics: ./skills/semantics/SKILL.md
results:
  Ok: CodeKnowledge.CompileArtifactSkills.Ok
  Error: CodeKnowledge.CompileArtifactSkills.Error
