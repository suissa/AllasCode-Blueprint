execution:
  timeout_ms: 5000
  idempotent: true
  network: false
  deterministic_when_inputs_are_equal: true
sandbox:
  enabled: true
  workspace_only: true
authority:
  mode: generated_write
  write_scope:
    - "generated/skills/<canonical_label>/authoring/**"
    - "generated/skills/<canonical_label>/semantics/**"
failure:
  preserve_original_intent: true
  unresolved: Human-in-the-Healing-Loop
