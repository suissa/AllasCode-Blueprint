version: 1.0.0
retry:
  max_attempts: 2
  timeout_ms: 1500
  backoff_ms: 25
human:
  enabled: true
  resume_ttl_ms: 86400000
  required_context:
    - original-event
    - original-payload
    - action-error
    - action-governance
    - correlation-id
normalization:
  allowed_in:
    - validation
    - self-healing
  reversible_required: true
audit:
  enabled: true
  record_payload_hash: true
