api_version: allascode/v1
kind: Behavior
identity:
  canonical_label: CheckoutAgent.BuyOneProduct
  name: BuyOneProduct
  version: 1.0.0
owner:
  agent: CheckoutAgent
intent: BuyOneProductIntent
classification:
  composite: true
  deterministic: true
execution:
  authority: Runtime
  implementation_may_execute_functions: false
  action_result_transport: local_event
  action_result_semantics:
    Ok: advance_or_complete
    Error: enter_self_healing
  completion:
    rule: emit_agent_ok_only_when_no_remaining_action_exists_in_intent_2flow
    event: CheckoutAgent.BuyOneProduct.Ok
  failure:
    rule: emit_agent_error_only_after_self_healing_pipeline_is_exhausted
    event: CheckoutAgent.BuyOneProduct.Error
plan:
  - ResolveProduct
  - ResolveAuthoritativePrice
  - ReserveOneStockUnit
  - AuthorizePayment
  - RegisterSale
  - CommitStockReservation
compensation:
  reverse_order: true
  on_failure_after_payment:
    - ReleasePaymentAuthorization
    - ReleaseStockReservation
  on_failure_before_payment:
    - ReleaseStockReservation
invariants:
  - quantity_is_exactly_one
  - price_is_authoritative_at_execution
  - stock_is_reserved_before_payment
  - sale_is_not_committed_without_payment_authorization
  - action_ok_error_originate_from_action_execution
  - runtime_materializes_action_result_events
  - agent_ok_requires_2flow_exhaustion
  - agent_error_requires_self_healing_exhaustion
  - foreign_agent_identity_is_runtime_injected_from_2flow
