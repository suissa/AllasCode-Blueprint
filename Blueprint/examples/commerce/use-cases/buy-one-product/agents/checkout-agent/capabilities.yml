capabilities:
  read:
    - Product.catalog
    - Product.price
    - Stock.availability
  write:
    - Stock.reservation
    - Sale.record
  external_effects:
    - Payment.authorize
    - Payment.release
  constraints:
    - all_effects_must_be_invoked_by_runtime
    - no_direct_agent_to_agent_calls
    - no_event_emission_from_agent_code
