nodes:
  Supplier: commerce.entity.supplier
  Customer: commerce.entity.customer
  Product: commerce.entity.product
  Purchase: commerce.entity.purchase
  Inventory: commerce.entity.inventory
  Stock: commerce.entity.stock
  Sale: commerce.entity.sale
  Payment: commerce.entity.payment
  Financial: commerce.entity.financial
  Invoice: commerce.entity.invoice
  AccountingEntry: commerce.entity.accounting-entry
  User: commerce.entity.user
edges:
  - Supplier -> Purchase: supplies
  - Purchase -> Product: contains
  - Purchase -> Stock: increases-via-event
  - Purchase -> Financial: creates-expense-via-event
  - Inventory -> Stock: governs
  - Stock -> Product: quantifies
  - Customer -> Sale: purchases
  - Sale -> Product: contains-after-resolution
  - Sale -> Stock: decreases-via-event
  - Sale -> Financial: creates-revenue-via-event
  - Sale -> Invoice: requests-issuance-via-event
  - Payment -> Sale: may-settle
  - Payment -> Purchase: may-evidence
  - Payment -> Financial: provides-monetary-evidence
  - Financial -> AccountingEntry: records-via-event
  - Invoice -> AccountingEntry: records-fiscal-effect-via-event
  - User -> Sale: may-initiate-via-intent
  - User -> Purchase: may-initiate-via-intent
