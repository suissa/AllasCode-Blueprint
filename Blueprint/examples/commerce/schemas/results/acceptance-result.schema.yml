$schema: https://json-schema.org/draft/2020-12/schema
$id: https://allascode.dev/schemas/results/acceptance-result.schema.yml
title: AllasCode Acceptance Result
allOf:
  - $ref: ./semantic-result.schema.yml
  - type: object
    required:
      - acceptance
    properties:
      semantic_result:
        type: object
        properties:
          kind:
            const: acceptance
      acceptance:
        type: object
        required:
          - id
          - scope
          - criteria
          - decision
        properties:
          id:
            type: string
            minLength: 1
          scope:
            type: string
            enum: [action, integration, e2e, security, release, deployment, system]
          profile:
            type: string
          owner:
            type: string
          decision:
            type: string
            enum: [accepted, rejected, conditional, pending]
          criteria:
            type: array
            minItems: 1
            items:
              type: object
              required: [id, status]
              properties:
                id:
                  type: string
                description:
                  type: string
                status:
                  $ref: ./semantic-result.schema.yml#/$defs/status
                evidence_refs:
                  type: array
                  items:
                    type: string
                  uniqueItems: true
                reason:
                  type: string
              additionalProperties: false
          gate_version:
            type: string
        additionalProperties: false
    unevaluatedProperties: false
