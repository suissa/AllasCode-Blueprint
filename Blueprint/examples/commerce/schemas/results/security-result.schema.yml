$schema: https://json-schema.org/draft/2020-12/schema
$id: https://allascode.dev/schemas/results/security-result.schema.yml
title: AllasCode Security Result
allOf:
  - $ref: ./semantic-result.schema.yml
  - type: object
    required:
      - security
    properties:
      semantic_result:
        type: object
        properties:
          kind:
            const: security
      security:
        type: object
        required:
          - id
          - source
          - findings
        properties:
          id:
            type: string
            minLength: 1
          source:
            type: string
            enum:
              - osv
              - github-advisory
              - cisa-kev
              - npm-audit
              - sast
              - dast
              - fuzz
              - regression
              - custom
          database_snapshot:
            type: string
          ruleset_hash:
            type: string
          findings:
            type: array
            items:
              type: object
              required:
                - id
                - status
              properties:
                id:
                  type: string
                aliases:
                  type: array
                  items:
                    type: string
                  uniqueItems: true
                status:
                  type: string
                  enum: [open, mitigated, fixed, not-applicable, false-positive]
                severity:
                  type: string
                  enum: [unknown, low, medium, high, critical]
                known_exploited:
                  type: boolean
                package:
                  type: object
                  properties:
                    ecosystem:
                      type: string
                    name:
                      type: string
                    version:
                      type: string
                    vulnerable_range:
                      type: string
                    fixed_version:
                      type: string
                  additionalProperties: false
                exploit_precondition:
                  type: string
                remediation:
                  type: object
                  properties:
                    patch_ref:
                      type: string
                    regression_test_id:
                      type: string
                    generated_by_agent:
                      type: boolean
                    requalified:
                      type: boolean
                    residual_risk:
                      type: string
                  additionalProperties: false
                reason:
                  type: string
              additionalProperties: false
        additionalProperties: false
    unevaluatedProperties: false
