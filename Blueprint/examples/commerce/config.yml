system:
  canonical-label: commerce.simple

contexts:
  purchase: ./contexts/purchase.yml
  inventory: ./contexts/inventory.yml
  financial: ./contexts/financial.yml
  sales: ./contexts/sales.yml
  identity: ./contexts/identity.yml
  fiscal: ./contexts/fiscal.yml
  accounting: ./contexts/accounting.yml

flows:
  purchase-products: ./flows/purchase-products.2flow
  process-sale: ./flows/process-sale.2flow
  authorize-operator: ./flows/authorize-operator.2flow
  associate-customer-to-sale: ./flows/associate-customer-to-sale.2flow
  issue-sale-invoice: ./flows/issue-sale-invoice.2flow
  record-accounting-effect: ./flows/record-accounting-effect.2flow
  ci-cd: ./ci-cd.2flow

policies:
  self-healing: enabled
  normalization:
    allowed-in: [validation, self-healing]
  terminal-events: [Ok, Error]

facop:
  protocol: FACoP
  config: ./facop.yml
  ci-cd: ./ci-cd.2flow
  evidence-subject: action.semantic_id
  pipeline: semantic-graph -> semantic-impact -> evidence-plan -> evidence-passport

ci:
  semantic-source: ./ci-cd.2flow
  adapter-source: AllasCode-infra
  platform: github-actions
  language: typescript
  project-directory: Blueprint/examples/commerce
  runtime:
    provider: node
    version: 24
  variables:
    package_manager: npm
  triggers:
    pull-request:
      branches: [examples]
      paths: [Blueprint/examples/commerce/**, .github/workflows/commerce-example.yml]
    manual: true
  pipeline:
    generated-from: ./ci-cd.2flow
    note: Legacy adapter projection. The 2flow graph is the semantic authority.
