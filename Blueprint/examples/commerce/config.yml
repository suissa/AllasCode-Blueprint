system:
  canonical-label: commerce.simple

contexts:
  purchase: ./contexts/purchase.yml
  inventory: ./contexts/inventory.yml
  financial: ./contexts/financial.yml
  sales: ./contexts/sales.yml

flows:
  purchase-products: ./flows/purchase-products.2flow
  process-sale: ./flows/process-sale.2flow

policies:
  self-healing: enabled
  normalization:
    allowed-in:
      - validation
      - self-healing
  terminal-events:
    - Ok
    - Error

ci:
  source: AllasCode-infra
  platform: github-actions
  language: typescript
  project-directory: Blueprint/examples/commerce
  runtime:
    provider: node
    version: 24
  variables:
    package_manager: npm
  triggers:
    pull-request:
      branches:
        - examples
      paths:
        - Blueprint/examples/commerce/**
        - .github/workflows/commerce-example.yml
    manual: true
  pipeline:
    - capability: DependencyInstall
    - capability: Validate
      command: npm run check
    - capability: Test
    - capability: Demo
      command: npm run demo
