id: commerce.simple
name: Simple Commerce System
version: 0.1.0
kind: semantic-system

exposes:
  intents:
    - PurchaseProductsIntent
    - ProcessSaleIntent
  events:
    - PurchaseCompleted
    - SaleCompleted
    - Error
  entities:
    - Supplier
    - Product
    - Purchase
    - Inventory
    - Financial
    - Sale

semantics:
  terminal-events:
    - Ok
    - Error
  implementation-independent: true
