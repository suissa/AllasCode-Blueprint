<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AllasCode Benchmark Protocol — JS vs WASM</title>
  <style>
    :root {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color-scheme: light dark;
    }
    body {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }
    button {
      font: inherit;
      padding: 10px 16px;
      cursor: pointer;
    }
    pre {
      overflow: auto;
      padding: 16px;
      border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
      border-radius: 8px;
      min-height: 140px;
    }
    .status {
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <h1>AllasCode Benchmark Protocol v0.1</h1>
  <p>Reference behavioral-equivalence and performance harness for JavaScript vs Zig/WebAssembly.</p>
  <button id="run" type="button">Run benchmark</button>
  <div class="status" id="status">Loading harness…</div>
  <pre id="output" aria-live="polite"></pre>

  <script type="module">
    import { AllasBenchmark } from "./harness.js";

    const button = document.querySelector("#run");
    const status = document.querySelector("#status");
    const output = document.querySelector("#output");

    status.textContent = "ABP_READY";

    button.addEventListener("click", async () => {
      button.disabled = true;
      status.textContent = "Running…";
      output.textContent = "";

      try {
        const evidence = await AllasBenchmark.run();
        output.textContent = JSON.stringify(evidence, null, 2);
        status.textContent = evidence.runs.every((run) => run.status === "valid")
          ? "Valid evidence"
          : "Invalid/failed evidence — inspect output";
      } catch (error) {
        status.textContent = "Harness failure";
        output.textContent = error?.stack ?? String(error);
        console.error(error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
