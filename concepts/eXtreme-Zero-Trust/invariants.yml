invariants:
  - id: LEDSA-001
    name: append-before-ack
    expression: Ack(message) -> LocalAppendReceipt(message)
    level: mandatory
  - id: LEDSA-002
    name: replay-safe
    expression: Seen(message_id,jti,session) -> NoLogicalEffect
    level: mandatory
  - id: LEDSA-003
    name: single-local-consumption
    expression: Consume(capability) -> !ConsumeAgain(capability)
    level: mandatory
  - id: LEDSA-004
    name: intent-gated-release
    expression: Release(message) -> IntentAllowed(message)
    level: mandatory
  - id: LEDSA-005
    name: crypto-gated-release
    expression: Release(message) -> CryptoValid(message)
    level: mandatory
  - id: LEDSA-006
    name: deterministic-convergence
    expression: SameChangeSet(replicas) -> SameFinalCRDTState(replicas)
    level: mandatory
  - id: LEDSA-007
    name: secret-isolation
    expression: Actor -> !PrivateKeyMaterial
    level: mandatory
  - id: LEDSA-008
    name: explicit-effects
    expression: ObservableSideEffect -> DeclaredEffect
    level: target
  - id: LEDSA-009
    name: semantic-transition
    expression: Transition(from,to) -> AtomicBehaviorAllows(from,to)
    level: target
