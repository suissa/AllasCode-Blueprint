services:
  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  # Sidecars are intentionally not enabled until their container image and
  # production crypto provider are configured. This avoids presenting the
  # placeholder PQ boundary as a secure deployment.
