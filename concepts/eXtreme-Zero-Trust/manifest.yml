name: extreme-zero-trust-ledsa
canonical_label: AllasCode.Concepts.eXtremeZeroTrust.LEDSA
version: 0.1.0
status: experimental
kind: architecture-concept

paradigms:
  - linear-event-driven-secure-architecture
  - extreme-zero-trust
  - intent-driven-development
  - semantic-as-code
  - actor-model
  - event-sourcing
  - crdt

exposes:
  protocol: AON-ATCP
  event_semantics: linear-capability
  transport_semantics: at-least-once
  logical_effect_target: exactly-once
  security:
    identity: WebAuthn/FIDO2
    proof_of_possession: DPoP
    transport: mTLS
    post_quantum: crypto-agile-hybrid-provider
  runtime:
    crypto: Rust
    effects: Zig runtime transparent default effects
    actors: ZigActores
    semantic_atomicbehavior_type: LinearAutodestroy
    semantic_types: Haskell
  ubiq:
    protocols:
      default:
        - quic
        - nats
      optional:
        - grpc
        - websocket
    guarantees:
      delivery: at-least-once
      logical_effect_target: exactly-once
      primitives:
        - ACK
        - first-writer
        - dedupe
        - replay-guard
        - retry-window
        - outbox-aggregation
    security:
      mtls: required
      dpop: optional-configurable
      zerotrust: required
    consumption:
      default:
        - LinearConsumeOnce
        - ZeroTrust
      variants:
        - LinearConsumeAll
        - LinearConsumeAllZeroTrust
    retry: 1 minute
    outbox_aggregation: 1 minute per entity_id
    tgc: 20-30 seconds
    direct_delivery: known Agent/subscriber address may bypass broker routing

invariants: ./invariants.yml
configuration: ./config.yml
