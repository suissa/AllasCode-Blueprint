[package]
name = "allascode-extreme-zero-trust-sidecar"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-nats = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
