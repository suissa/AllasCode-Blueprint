apiVersion: allascode.io/v1alpha1
kind: DataPlaneFitnessSuite

metadata:
  id: default-dataplane-fitness
  version: 1.0.0

spec:
  comparison:
    baseline: current-best
    requireSameEvaluationEpoch: true
    requireSameDataSnapshot: true
    requireSameEnvironmentClass: true

  experiment:
    repetitions: contract-defined

    warmup:
      required: true

    statistics:
      required: true
      storeRawSamples: true
      storeDistribution: true
      storeEffectSize: true
      storeConfidenceInterval: true

  functions:
    - id: semantic-equivalence
      category: semantic
      role: invariant
      evaluator: semantic-contract-conformance

    - id: database-replaceability
      category: replaceability
      role: invariant
      evaluator: adapter-contract-equivalence

    - id: technical-performance
      category: technical
      role: objective
      metrics:
        - latency-p50
        - latency-p95
        - latency-p99
        - throughput
        - error-rate
        - cpu
        - memory
        - io
        - storage
        - saturation
        - availability

    - id: schema-compatibility
      category: schema
      role: constraint
      evaluator: schema-evolution-conformance

    - id: data-ownership
      category: ownership
      role: invariant
      evaluator: ownership-graph

    - id: change-propagation
      category: coupling
      role: objective
      metrics:
        - blast-ratio
        - transitive-dependencies

    - id: distributed-invariants
      category: distributed
      role: invariant
      evaluator: fault-injection-state-model
      scenarios:
        - process-crash
        - timeout
        - duplicate-delivery
        - reordered-delivery
        - network-partition
        - retry
        - interrupted-cutover
        - broker-restart
        - leader-loss
        - partial-migration

    - id: data-age
      category: freshness
      role: constraint
      metrics:
        - age-p50
        - age-p95
        - age-p99

    - id: semantic-data-quality
      category: quality
      role: constraint
      dimensions:
        - completeness
        - validity
        - consistency
        - uniqueness
        - accuracy
        - freshness
        - provenance

    - id: technology-maturity
      category: operational-risk
      role: constraint
      dimensions:
        - maintenance
        - security-response
        - upgrade-path
        - backup-restore
        - recovery-behavior
        - license
        - artifact-provenance
        - operator-complexity
        - adapter-completeness

    - id: economic-value
      category: economic
      role: objective
      evidenceClasses:
        - measured
        - derived
        - forecast

    - id: affordability
      category: financial
      role: gate
      evaluator: current-business-state

    - id: reversibility
      category: recovery
      role: gate
      metrics:
        - rollback-supported
        - rollback-rto
        - rollback-rpo
        - reconciliation-cost
        - dual-run-cost
        - expected-recovery-cost
