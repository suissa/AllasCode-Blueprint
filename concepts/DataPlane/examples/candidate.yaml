apiVersion: allascode.io/v1alpha1
kind: DataPlaneCandidate

metadata:
  id: database-x
  version: 1.3.0

spec:
  technology:
    name: Database-X
    version: 8.4.2
    artifactDigest: "sha256:ARTIFACT_DIGEST"

  adapter:
    ref: adapter://database-x
    version: 1.3.0
    digest: "sha256:ADAPTER_DIGEST"

  discovery:
    source:
      type: external-paper
      ref: "candidate-source-123"

    externalClaims:
      acceptedAsFitnessEvidence: false

  eligibility:
    modes:
      - evidence-optimized

    requirements:
      artifactIdentity: true
      licenseAccepted: true
      semanticAdapterAvailable: true
      backupRestoreAvailable: true
      sandboxExecutable: true

  evaluation:
    required: true
    evidenceAuthority: local-current-context

  history:
    evaluations: []
